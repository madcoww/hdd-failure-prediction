<html><head><meta charset="utf-8"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap"><style>
:root{--bg:#0C1322;--pn:#121B2D;--pn2:#172238;--ln:#22304A;--ink:#E6ECF6;--sub:#8E9BB4;--mute:#5E6C87;
--blue:#3D8BFF;--cyan:#4CC9F0;--red:#FF4D5E;--amb:#FFB020;--grn:#2BD47D}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;
font-size:14px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.num{font-family:Rajdhani,'Pretendard Variable',sans-serif;font-variant-numeric:tabular-nums}
.sb{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:14px;font-weight:600;flex:none}
.hd{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--ln);flex:none}
.hd .t{font-size:17px;font-weight:700}
.hd .r{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--sub)}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#3D8BFF,#4CC9F0);display:flex;align-items:center;justify-content:center}
.bell{position:relative}.bell i{position:absolute;top:-4px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:var(--red);
color:#fff;font-size:10px;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
main{flex:1;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.tabbar{height:76px;border-top:1px solid var(--ln);background:#0F182A;display:flex;padding:8px 6px 22px;flex:none}
.tabbar div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute)}
.tabbar div.on{color:var(--blue);font-weight:600}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:12px}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:600;
background:rgba(142,155,180,.12);color:#B4C0D6}
.pill.r{background:rgba(255,77,94,.15);color:#FF7D8A}.pill.a{background:rgba(255,176,32,.15);color:#FFC452}
.pill.b{background:rgba(61,139,255,.16);color:#86B6FF}.pill.g{background:rgba(43,212,125,.14);color:#5BE39A}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:10px;font-weight:600;font-size:14.5px;
border:1px solid var(--ln);background:var(--pn2);color:var(--ink)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.sm{height:36px;font-size:13.5px;border-radius:8px}
.loc{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:12px}
.loc span{padding:2px 7px;border-radius:5px;background:var(--pn2);border:1px solid var(--ln);color:#C9D3E5}
.loc span.k{background:rgba(255,77,94,.15);border-color:rgba(255,77,94,.35);color:#FF8B96;font-weight:600}
.seg{display:flex;gap:2px}.seg i{flex:1;border-radius:1.5px;background:#23314B}
.sec{font-size:13px;color:var(--sub);font-weight:600;margin-top:2px}
.row{display:flex;justify-content:space-between;align-items:center}
.foot{position:absolute;left:0;right:0;bottom:0;height:0}
</style></head><body><div class="sb"><span class="num" style="font-size:16px">9:41</span><span style="display:flex;gap:6px;align-items:center"><svg width="18" height="11"><rect x="0" y="7" width="3" height="4" fill="#E6ECF6"/><rect x="5" y="5" width="3" height="6" fill="#E6ECF6"/><rect x="10" y="2" width="3" height="9" fill="#E6ECF6"/><rect x="15" y="0" width="3" height="11" fill="#E6ECF6"/></svg><svg width="25" height="12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="#8E9BB4"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.5" fill="#E6ECF6"/><rect x="23" y="4" width="2" height="4" rx="1" fill="#8E9BB4"/></svg></span></div><div class="hd"><div class="logo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><path d="M6 16h.01M10 16h.01"/></svg></div><span class="t">알림 설정</span><div class="r"><span class="bell"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><i>2</i></span></div></div>
<main>
 <div class="card"><div class="row" style="padding:14px">
  <div><b style="font-size:15px">이 기기로 알림 받기</b><div style="font-size:12px;color:var(--sub);margin-top:3px">새 위험 디스크가 생기면 바로 알립니다</div></div><span style="width:48px;height:28px;border-radius:14px;background:var(--blue);position:relative;flex:none"><span style="position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span></div></div>
 <span class="sec">받을 등급</span>
 <div class="card" style="overflow:hidden"><div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--ln)"><span style="width:20px;height:20px;border-radius:50%;border:2px solid var(--blue);display:flex;align-items:center;justify-content:center"><span style="width:10px;height:10px;border-radius:50%;background:var(--blue)"></span></span><span>위험만 (상위 1%)</span></div><div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--ln)"><span style="width:20px;height:20px;border-radius:50%;border:2px solid #3A4D6E;display:flex;align-items:center;justify-content:center"></span><span>위험 + 주의 (상위 5%)</span></div></div>
 <span class="sec">이메일 요약 (하루 1번)</span>
 <div class="card" style="padding:12px 14px;display:flex;flex-direction:column;gap:10px">
  <div class="row"><span>매일 07:30 요약 메일</span><span style="width:48px;height:28px;border-radius:14px;background:var(--blue);position:relative;flex:none"><span style="position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff"></span></span></div>
  <div style="height:42px;border:1px solid var(--ln);border-radius:9px;padding:0 12px;display:flex;align-items:center;color:#C9D3E5;background:var(--pn2)">ops-team@example.com</div></div>
 <div class="btn">테스트 알림 보내기</div>
 <div style="padding:11px 13px;border-radius:10px;background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.3);font-size:12.5px;line-height:1.5;color:#E8D3A6">
  <b style="color:#FFC452">아이폰은 홈 화면에 추가해야 알림을 받습니다</b><br>Safari 공유 버튼 → 홈 화면에 추가 → 추가한 아이콘으로 열기</div>
</main><div class="tabbar"><div class=""><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg><span>홈</span></div><div class=""><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><span>디스크</span></div><div class=""><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>교체 목록</span></div><div class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span>알림 설정</span></div></div></body></html>
